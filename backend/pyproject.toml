[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papergen-backend"
version = "0.1.0"
description = "AI Question Paper Generation Platform - Backend API & Workers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "PaperGen Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "google-genai>=2.18.1,<3.0.0",
    "jsonschema>=4.23.0",
    "sympy>=1.13.0,<2.0.0",
    "ortools>=9.15.6755,<10.0.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
    "boto3>=1.40.0,<2.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "latex2mathml>=3.81.1,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.168.0,<7.0.0",
    "httpx>=0.27.0",
    "pypdf>=6.0.0,<7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*", "packages*"]

[tool.setuptools.package-data]
"packages.prompts" = ["artifacts/*/*.json"]
"packages.prompts.templates" = ["*.md", "catalog/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
# Pinned rather than left to the default. pytest-asyncio warns when this is unset
# because the default is scheduled to change, and the value decides which event loop
# an async fixture is created on. "function" keeps every fixture on the same loop as
# the test that uses it, which is what the database fixtures in tests/conftest.py
# assume - an engine created on one loop cannot be used from another.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: requires a reachable, migrated PostgreSQL database (see tests/conftest.py)",
]
