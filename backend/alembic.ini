# Alembic configuration for the PaperGen backend.
#
# Generated from the `async` template shipped with the pinned Alembic (1.19.1) —
# `alembic init -t async` — then customized. Two customizations matter:
#
#   1. `script_location` points at packages/db/migrations, because doc 07 §3 places
#      "SQLAlchemy models, Alembic migrations, RLS policies, seeds" under
#      backend/packages/db/.
#
#   2. There is deliberately **no `sqlalchemy.url` key**. env.py takes the URL from
#      app.core.config.Settings (P1-T2) so that the connection string has exactly one
#      source of truth. It is also never written back into this config object, because
#      ConfigParser applies %-interpolation when a value is read — a password
#      containing a literal % would raise InterpolationSyntaxError. env.py builds the
#      engine directly instead.
#
# Always run alembic with backend/ as the working directory: pydantic-settings
# resolves `env_file=".env"` relative to the CWD, so from anywhere else every
# required setting reports as missing.

[alembic]
script_location = %(here)s/packages/db/migrations

# Revision ids are zero-padded and assigned by hand (--rev-id 0003), so the version
# filenames sort in migration order in a directory listing.
file_template = %%(rev)s_%%(slug)s

# Prepended to sys.path so env.py and the revisions can `import app...`.
prepend_sys_path = .

path_separator = os

# Timestamps in generated revisions use the machine's local time.
# timezone =

truncate_slug_length = 40

# NOTE: no sqlalchemy.url here on purpose — see the header comment.

[post_write_hooks]
# No formatter hook configured. If ruff/black are adopted for the backend, wire the
# hook here so generated revisions match the repo style without a manual pass.

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
